# /etc/systemd/journald.conf.d/10-journal-persist.conf
#
# Keep the journal across reboots.
#
# Raspberry Pi OS ships `Storage=volatile` in /etc/systemd/journald.conf to
# spare the SD card. On a product that is diagnosed remotely that trade is the
# wrong way round: the faults worth investigating are exactly the ones a
# customer clears by power-cycling, so the reboot that appears to fix it also
# destroys the only record of it.
#
# Found on 30 Aug 2026. A pre-staged unit froze on its own screen, was restarted,
# and there was nothing left to read — one boot on record, and it was the boot
# after the fault. `agentxx` has eleven boots and has always had them, because
# its image predates that default; nothing in this repo had ever decided the
# question either way.
#
# BOUNDED, so the card wear is a known number rather than an open question:
# 64 MB total, 8 MB per file. On a device this quiet that is several boots.
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
