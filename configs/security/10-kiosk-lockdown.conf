# /etc/X11/xorg.conf.d/10-kiosk-lockdown.conf
#
# The panel is on a customer site with exposed USB ports. Without these, any
# keyboard reaching the unit is one chord away from a text console:
#   Ctrl+Alt+F1..F12   switch VT  -> a getty login prompt
#   Ctrl+Alt+Backspace zap X      -> kills the kiosk, leaving the console
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap"      "true"
EndSection
