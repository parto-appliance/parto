<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="434" viewBox="0 0 1160 434" role="img" aria-labelledby="title desc">
  <title id="title">Scenario B — Share the Spoke LAN with physical devices</title>
  <desc id="desc">Wi-Fi clients connect to an access point in bridge mode. Wired clients connect to an Ethernet switch. Either path reaches the Spoke LAN through the laptop’s dedicated wired adapter. The Spoke supplies DHCP. The Spoke WAN uses hypervisor NAT over laptop Wi-Fi to reach the Hub through an encrypted tunnel. The Hub provides Internet egress when sharing is enabled.</desc>
  <defs>
    <marker id="lan-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L8 4.5 1 8" fill="none" stroke="#5eead4" stroke-width="1.6"/>
    </marker>
    <marker id="wan-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L8 4.5 1 8" fill="none" stroke="#93c5fd" stroke-width="1.6"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #f1f5f9; }
      .subtitle, .detail { fill: #b8c8db; font-size: 14px; }
      .label { font-size: 16px; font-weight: 650; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.25px; }
      .teal { fill: #99f6e4; }
      .blue { fill: #bfdbfe; }
      .card { fill: #18263a; stroke: #3b526e; }
      .lan { fill: none; stroke: #5eead4; stroke-width: 2.4; }
      .wan { fill: none; stroke: #93c5fd; stroke-width: 2.4; }
    </style>
  </defs>

  <rect x="1" y="1" width="1158" height="432" rx="22" fill="#0e1828" stroke="#30435c"/>
  <text x="30" y="45" font-size="28" font-weight="700">Scenario B · Connect physical devices to the Spoke LAN</text>
  <text x="30" y="71" class="subtitle">Choose Wi-Fi, wired Ethernet, or both. The Spoke supplies client addresses and routes traffic to the Hub.</text>

  <rect x="24" y="96" width="441" height="312" rx="16" fill="#10272e" stroke="#27555a"/>
  <text x="42" y="124" class="kicker teal">PHYSICAL SPOKE LAN</text>
  <rect x="479" y="96" width="246" height="312" rx="16" fill="#152437" stroke="#3b526e"/>
  <text x="497" y="124" class="kicker">LAPTOP HYPERVISOR</text>
  <rect x="739" y="96" width="397" height="312" rx="16" fill="#122239" stroke="#395879"/>
  <text x="757" y="124" class="kicker blue">TUNNEL AND INTERNET EGRESS</text>

  <g class="lan" marker-end="url(#lan-arrow)">
    <path d="M184 185H220"/>
    <path d="M184 298H220"/>
    <path d="M384 185H409Q426 185 426 202V225Q426 240 441 240H497"/>
    <path d="M384 298H409Q426 298 426 281V255Q426 240 441 240" marker-end="none"/>
  </g>
  <path class="wan" d="M707 300H728Q740 300 740 288V252Q740 240 752 240H854" stroke-dasharray="7 5" marker-end="url(#wan-arrow)"/>
  <path class="wan" d="M982 240H1019" marker-end="url(#wan-arrow)"/>

  <g>
    <rect class="card" x="42" y="150" width="142" height="70" rx="12"/>
    <text class="label" x="56" y="181">Wi-Fi clients</text>
    <text class="detail" x="56" y="202">Phone or laptop</text>

    <rect class="card" x="42" y="263" width="142" height="70" rx="12"/>
    <text class="label" x="56" y="294">Wired clients</text>
    <text class="detail" x="56" y="315">Desktop or device</text>

    <rect class="card" x="220" y="150" width="164" height="70" rx="12"/>
    <text class="label" x="234" y="181">Access point</text>
    <text class="detail" x="234" y="202">LAN port · AP mode</text>

    <rect class="card" x="220" y="263" width="164" height="70" rx="12"/>
    <text class="label" x="234" y="294">Ethernet switch</text>
    <text class="detail" x="234" y="315">Wired LAN ports</text>

    <text class="label teal" x="42" y="369">Dedicated wired adapter</text>
    <text class="detail" x="42" y="390">The hypervisor bridges it to the Spoke LAN.</text>
  </g>

  <rect x="497" y="161" width="210" height="162" rx="14" fill="#192c43" stroke="#6a92b9"/>
  <text x="514" y="192" font-size="21" font-weight="700">Parto Spoke</text>
  <path d="M514 207H690" stroke="#425c76"/>
  <text class="label teal" x="514" y="232">eth1 · LAN</text>
  <text class="detail" x="514" y="253">172.30.212.254/24</text>
  <text class="detail" x="514" y="273">DHCP for physical clients</text>
  <text class="label blue" x="514" y="303">eth0 · WAN</text>
  <text class="label blue" x="497" y="369">Hypervisor NAT</text>
  <text class="detail" x="497" y="390">Uses the laptop’s Wi-Fi uplink.</text>

  <text class="label blue" text-anchor="middle" x="801" y="207">Encrypted</text>
  <text class="detail" text-anchor="middle" x="801" y="225">overlay tunnel</text>

  <rect class="card" x="854" y="198" width="128" height="84" rx="12"/>
  <text class="label" x="870" y="234">Parto Hub</text>
  <text class="detail" x="870" y="256">Internet sharing</text>

  <rect class="card" x="1019" y="198" width="101" height="84" rx="12"/>
  <text class="label" x="1069.5" y="245" text-anchor="middle">Internet</text>

  <text class="label blue" x="757" y="369">Hub Internet egress</text>
  <text class="detail" x="757" y="390">The Hub forwards traffic when sharing is enabled.</text>
</svg>
